<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title> Spring Boot </title>
    <link rel="stylesheet" href="/css/styles.css"/>
    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <style>
        .center {
            display: flex;
            justify-content: center;
            align-items: center;
            position : absolute;
            top : 35%;
            bottom : 45%;
            right : 38%;
            left : 38%;
        }

        .margRight {
            margin-right: 31px;
        }
    </style>
</head>
<body>
<div class="container-fluid d-flex align-items-center justify-content-center center">
    <div class="p-5 my-5 border d-flex flex-column align-items-center justify-content-center">
        <h3>Login with Username and Password</h3>
        <div class="log">
            <form class="formulaire" method="post" th:action="@{/app/login}" role="form">
                <div th:if="${param.error}">
                    <p class="alert alert-danger text-wrap" role="alert">Invalid username or password</p>
                </div>
                <div class="row">
                    <div class="mt-5 w-100">
                        <div class="mb-3">
                            <label for="username" class="visually-hidden margRight">User: </label>
                            <input type="text" class="form-control" id="username" name="username" aria-required="true" required/>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="visually-hidden">Password: </label>
                            <input type="password" class="form-control" id="password" name="password" aria-required="true" required/>
                        </div>
                    </div>
                </div>
                <div class="mt-5 d-flex justify-content-center">
                    <button class="btn btn-primary w-100" type="submit">Login</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
